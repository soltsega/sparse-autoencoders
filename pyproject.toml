[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-autoencoders"
version = "0.1.0"
description = "Mechanistic Interpretability Suite: Sparse Autoencoders (SAE) & Activation Patching on GPT-2 Small"
authors = [
    { name = "Solomon Tsega" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "nbformat>=5.9.0",
    "ipykernel>=6.20.0",
]

[project.optional-dependencies]
interpretability = [
    "transformer-lens>=1.14.0",
    "sae-lens>=1.0.0",
]
